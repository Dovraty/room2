<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a classroom year in one page — week switcher on top, then each week as hero, dated timeline, subject "tables", shelf, small print. */
:root {
  --bg: #EEF3EA; --card: #FFFFFF; --ink: #2B1D3A; --muted: #655A73; --line: #D9DFD3;
  --pumpkin: #EE7417; --pumpkin-deep: #B04F08; --cta: #A94704; --cta-hover: #8A3A03; --ok: #237A3B; --tid-bg: #2B1D3A; --tid-fg: #F5F0F8; --leaf: #2F8A48; --berry: #CC3B33; --berry-deep: #9E2A24;
  --sun: #F4B227; --sky: #CFE3F2; --stem: #4E7A2F; --glow: #FFD45C; --chip: #F8EEDF;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Patrick Hand", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1424; --card: #261E31; --ink: #F2ECF7; --muted: #B5AAC3; --line: #3A3047;
    --pumpkin: #FF8A33; --pumpkin-deep: #E06A12; --cta: #A94704; --cta-hover: #C25306; --ok: #237A3B; --tid-bg: #352A48; --tid-fg: #F5F0F8; --leaf: #5CC274; --berry: #F06A60; --berry-deep: #C9463D;
    --sun: #FFC94D; --sky: #2C2840; --stem: #7FB25A; --glow: #FFE07A; --chip: #3A2C24; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1424; --card: #261E31; --ink: #F2ECF7; --muted: #B5AAC3; --line: #3A3047;
  --pumpkin: #FF8A33; --pumpkin-deep: #E06A12; --cta: #A94704; --cta-hover: #C25306; --ok: #237A3B; --tid-bg: #352A48; --tid-fg: #F5F0F8; --leaf: #5CC274; --berry: #F06A60; --berry-deep: #C9463D;
  --sun: #FFC94D; --sky: #2C2840; --stem: #7FB25A; --glow: #FFE07A; --chip: #3A2C24; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; text-wrap: balance; margin: 0; }
a { color: var(--pumpkin-deep); }
:focus-visible { outline: 3px solid var(--pumpkin); outline-offset: 3px; border-radius: 6px; }
.eyebrow { font-weight: 700; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.hand { font-family: var(--font-hand); }

#leaves { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
nav, main { position: relative; z-index: 1; }

/* ---------- Week switcher ---------- */
.weeknav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--line); }
.weeknav .wrap { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: thin; }
.wk {
  flex: none; display: grid; gap: 0; text-align: left; cursor: pointer;
  background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
  padding: 6px 14px; font: inherit; line-height: 1.2; transition: border-color .15s, transform .15s;
}
.wk:hover { border-color: var(--ink); transform: translateY(-1px); }
.wk b { font-family: var(--font-display); font-size: 1.05rem; }
.wk small { color: var(--muted); font-size: .78rem; white-space: nowrap; }
.wk[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.wk[aria-current="page"] small { color: var(--bg); opacity: .8; }
.wk .new { color: var(--pumpkin); }
.wk[aria-current="page"] .new { color: var(--sun); }
.wk.info { border-style: dashed; }

/* ---------- Hero ---------- */
.hero { padding-block: 34px 22px; }
.hero-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 24px; align-items: center; }
.hero h1 { font-size: clamp(2.5rem, 7vw, 4.8rem); font-weight: 800; letter-spacing: -0.01em; }
.hero h1 .tk { color: var(--pumpkin); }
.hero .sub { font-family: var(--font-display); font-size: clamp(1.4rem, 3.5vw, 2rem); font-weight: 700; margin-top: 6px; }
.week-line { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 0.95rem; }
.pill.week { background: var(--ink); color: var(--bg); }
.pill.old { border-style: dashed; color: var(--muted); border-color: var(--muted); }
.next-up { margin-top: 22px; display: inline-flex; gap: 12px; align-items: center; background: var(--chip); border-radius: 16px; padding: 12px 16px; }
.next-up .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pumpkin); flex: none; animation: pulse 1.8s ease-in-out infinite; }
.next-up strong { font-family: var(--font-display); font-size: 1.15rem; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .5; } }

.hero-art { position: relative; aspect-ratio: 1 / 1; max-width: 400px; width: 100%; justify-self: center; }
.hero-art svg { width: 100%; height: 100%; overflow: visible; }
.jack { transform-origin: 200px 360px; animation: bob 3.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-8px); } }
.flicker { animation: flicker 2.4s infinite; }
@keyframes flicker { 0%,100% { opacity: 1; } 42% { opacity: .82; } 45% { opacity: 1; } 70% { opacity: .9; } }
.curl { stroke-dasharray: 220; animation: curl 4s ease-in-out infinite alternate; }
@keyframes curl { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
.shine { animation: shine 3.6s ease-in-out infinite; }
@keyframes shine { 50% { opacity: .35; } }
.leafy { transform-box: fill-box; transform-origin: 0% 100%; animation: flutter 2.8s ease-in-out infinite; }
@keyframes flutter { 50% { transform: rotate(-10deg); } }
/* Per-week hero motions */
.cowjump { animation: cowjump 3.2s ease-in-out infinite alternate; }
@keyframes cowjump { 0% { transform: translate(-120px, 70px) rotate(-18deg); } 50% { transform: translate(0, -40px) rotate(0); } 100% { transform: translate(120px, 70px) rotate(18deg); } }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(.5); opacity: .4; } }
.drop { animation: drop 4s ease-in infinite; }
@keyframes drop { 0%, 35% { transform: translateY(0); opacity: 1; } 60% { transform: translateY(150px); opacity: 1; } 62% { transform: translateY(142px); } 66% { transform: translateY(150px); } 90% { opacity: 1; } 100% { transform: translateY(150px); opacity: 0; } }
.stack { transform-origin: 200px 380px; animation: stackwob 2.6s ease-in-out infinite; }
@keyframes stackwob { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
.stack .top { transform-box: fill-box; transform-origin: center bottom; animation: stackwob 1.3s ease-in-out infinite reverse; }
.march { animation: march 9s linear infinite; }
@keyframes march { from { transform: translateX(0); } to { transform: translateX(440px); } }
.antleg { transform-box: fill-box; transform-origin: top center; animation: antleg .35s ease-in-out infinite alternate; }
@keyframes antleg { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
.monkey { animation: monkeyjump 1.1s ease-in-out infinite; }
@keyframes monkeyjump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-90px); } }
.mattress { transform-box: fill-box; transform-origin: center bottom; animation: mattress 1.1s ease-in-out infinite; }
@keyframes mattress { 0%, 100% { transform: scaleY(.72); } 20%, 80% { transform: scaleY(1); } }
.arms { transform-box: fill-box; transform-origin: center bottom; animation: arms 1.1s ease-in-out infinite; }
@keyframes arms { 0%, 100% { transform: scaleY(.85); } 50% { transform: scaleY(1.1); } }
.rocket { animation: rocket 2.4s ease-in-out infinite; }
@keyframes rocket { 0%, 100% { transform: translate(0, 0) rotate(-2deg); } 50% { transform: translate(0, -18px) rotate(2deg); } }
.flame { transform-box: fill-box; transform-origin: center top; animation: flame .18s ease-in-out infinite alternate; }
@keyframes flame { from { transform: scaleY(.75) scaleX(.95); } to { transform: scaleY(1.1) scaleX(1.05); } }
.streak { animation: streak 1.2s linear infinite; }
@keyframes streak { from { transform: translateY(-60px); opacity: 0; } 30% { opacity: .7; } to { transform: translateY(160px); opacity: 0; } }
.flip { transform-origin: 200px 0; animation: flip 4s ease-in-out infinite; }
@keyframes flip { 0%, 30% { transform: scaleX(1); } 60%, 100% { transform: scaleX(-1); } }
.floaty { transform-box: fill-box; transform-origin: center; animation: floaty 4s ease-in-out infinite; }
@keyframes floaty { 0% { transform: translateY(20px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-70px) rotate(12deg); opacity: 0; } }
.pour { transform-origin: 200px 356px; animation: pour 5s ease-in-out infinite; }
@keyframes pour { 0%, 40%, 100% { transform: rotate(0); } 55%, 80% { transform: rotate(-16deg); } }
.steam { animation: steam 2.1s ease-in-out infinite; }
@keyframes steam { 0% { transform: translateY(10px); opacity: 0; } 40% { opacity: .8; } 100% { transform: translateY(-26px); opacity: 0; } }
.drip { opacity: 0; animation: drip 5s ease-in infinite; }
@keyframes drip { 0%, 56% { opacity: 0; transform: translate(-4px, 40px); } 60% { opacity: 1; } 78% { opacity: 1; transform: translate(-10px, 170px); } 80%, 100% { opacity: 0; transform: translate(-10px, 170px); } }
.brush { animation: brush .5s ease-in-out infinite alternate; }
@keyframes brush { from { transform: translateX(-10px); } to { transform: translateX(10px); } }
.build { stroke-dasharray: 80; animation: build 5s ease-in-out infinite; }
@keyframes build { 0% { stroke-dashoffset: 80; } 50%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 80; } }
.climb { animation: climb 6s ease-in-out infinite; }
@keyframes climb { 0% { transform: translateY(300px); } 45% { transform: translateY(120px); } 55% { transform: translateY(120px); } 62% { transform: translateY(320px); } 70%, 100% { transform: translateY(300px); } }
.raindrop { animation: raindrop 1.6s linear infinite; }
@keyframes raindrop { from { transform: translateY(-20px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(320px); opacity: 0; } }
.note { transform-box: fill-box; animation: note 3s ease-in-out infinite; }
@keyframes note { 0% { transform: translateY(10px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(8px, -40px); opacity: 0; } }
.walk { animation: walk 4s ease-in-out infinite alternate; }
@keyframes walk { from { transform: translateX(-24px); } to { transform: translateX(24px); } }
.zip { animation: zip 3s ease-in-out infinite; }
@keyframes zip { 0%, 15% { transform: translateY(54px); } 60%, 100% { transform: translateY(0); } }
.speech { position: absolute; top: 4%; right: 0; transform: rotate(6deg); background: var(--card); border: 2px solid var(--ink); border-radius: 18px; padding: 6px 14px; font-family: var(--font-hand); font-size: 1.4rem; color: var(--ink); max-width: 70%; }

/* ---------- Sections ---------- */
section { padding-block: 30px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.sec-head h2 { font-size: clamp(1.9rem, 4.4vw, 2.6rem); font-weight: 800; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.ev { display: grid; grid-template-columns: 84px 1fr auto; gap: 16px; align-items: center; background: var(--card); border-radius: 18px; padding: 14px 18px 14px 14px; border: 2px solid transparent; transition: transform .2s ease; }
.ev:hover { transform: translateX(4px); }
.ev.next { border-color: var(--pumpkin); }
.ev.past { opacity: .62; }
.date-tile { width: 84px; border-radius: 12px; overflow: hidden; text-align: center; border: 2px solid var(--ink); background: var(--card); }
.date-tile .mo { background: var(--ink); color: var(--bg); font-weight: 700; font-size: .72rem; letter-spacing: .12em; padding: 2px 0; }
.date-tile .d { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1.25; font-variant-numeric: tabular-nums; }
.date-tile .d.range { font-size: 1.1rem; line-height: 2.05; }
.ev-body { min-width: 0; }
.ev-body h3 { font-size: 1.3rem; font-weight: 700; }
.ev-body p { margin: 2px 0 0; color: var(--muted); }
.todo { display: inline-block; margin-top: 6px; background: var(--chip); color: var(--ink); border-radius: 8px; padding: 2px 10px; font-weight: 700; font-size: .92rem; }
.status { font-weight: 700; font-size: .85rem; border-radius: 999px; padding: 3px 12px; white-space: nowrap; background: var(--line); color: var(--muted); }
.status.soon { background: var(--cta); color: #fff; }
.status.today { background: var(--ok); color: #fff; }

.learn { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.subject { background: var(--card); border-radius: 22px; padding: 20px; display: grid; grid-template-columns: 140px 1fr; gap: 18px; align-items: center; }
.subject.wide { grid-column: 1 / -1; }
.subject .art { width: 140px; height: 140px; background: var(--sky); border-radius: 18px; display: grid; place-items: center; overflow: hidden; }
.subject .art svg { width: 100%; height: 100%; }
.subject > div:last-child { min-width: 0; }
.subject h3 { font-size: 1.5rem; font-weight: 800; }
.subject .tag { color: var(--pumpkin-deep); }
.subject ul { margin: 8px 0 0; padding-left: 18px; }
.subject li + li { margin-top: 4px; }
.subject ul ul { margin-top: 4px; }
.subject p { margin: 6px 0 0; }

.trace { fill: none; stroke: var(--pumpkin); stroke-width: 3; stroke-linejoin: round; stroke-dasharray: 600; animation: trace 5s ease-in-out infinite; }
.trace-fill { fill: var(--pumpkin); animation: tracefill 5s ease-in-out infinite; }
@keyframes trace { 0% { stroke-dashoffset: 600; } 55%, 100% { stroke-dashoffset: 0; } }
@keyframes tracefill { 0%, 55% { opacity: 0; } 70%, 92% { opacity: 1; } 100% { opacity: 0; } }
.guide { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 5; opacity: .6; }
.wob { transform-box: fill-box; transform-origin: center; animation: wobble 3s ease-in-out infinite; }
.squ { transform-box: fill-box; transform-origin: center; animation: squish 2.6s ease-in-out infinite; }
@keyframes wobble { 50% { transform: rotate(-8deg) translateY(-4px); } }
@keyframes squish { 50% { transform: scale(1.12, .9); } }
.grow { transform-origin: 70px 112px; animation: grow 6s ease-in-out infinite; }
@keyframes grow { 0% { transform: scale(.25); } 40%, 85% { transform: scale(1); } 100% { transform: scale(.25); } }
.vine { stroke-dasharray: 120; animation: vine 6s ease-in-out infinite; }
@keyframes vine { 0% { stroke-dashoffset: 120; } 35%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 120; } }
.lamp-g { animation: glowg 2.4s ease-in-out infinite; }
@keyframes glowg { 50% { filter: drop-shadow(0 0 10px var(--leaf)); } }
.hop { transform-box: fill-box; transform-origin: center bottom; animation: hop 1.8s ease-in-out infinite; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-16px); } }
.blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.spin-slow { transform-box: fill-box; transform-origin: center; animation: spin 10s linear infinite; }
.beat { transform-box: fill-box; transform-origin: center; animation: beat 1.4s ease-in-out infinite; }
.choice-key { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-weight: 700; font-size: .92rem; }
.choice-key span { display: inline-flex; align-items: center; gap: 6px; }
.choice-key i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.panel { background: var(--card); border-radius: 22px; padding: 22px; min-width: 0; }
.panel h2 { font-size: 1.9rem; font-weight: 800; margin-bottom: 10px; }
.panel ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.panel ul.plain b { color: var(--pumpkin-deep); }
.clock-row { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
.clock { width: 86px; height: 86px; flex: none; }
.clock .hand-m { transform-origin: 50px 50px; animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.big-time { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--pumpkin-deep); line-height: 1; font-variant-numeric: tabular-nums; }
.thanks { margin-top: 16px; background: var(--chip); border-radius: 14px; padding: 12px 16px; font-family: var(--font-hand); font-size: 1.3rem; line-height: 1.3; }

.shelf { display: flex; align-items: flex-end; gap: 6px; padding: 18px 10px 0; border-bottom: 10px solid var(--pumpkin-deep); border-radius: 0 0 6px 6px; overflow-x: auto; }
.book { flex: 1 1 0; min-width: 52px; max-width: 90px; border-radius: 6px 6px 2px 2px; padding: 12px 6px; writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-display); font-weight: 700; font-size: .95rem; line-height: 1.1; color: #fff; transition: transform .25s ease; cursor: default; border: 0; text-align: left; }
.book:hover, .book:focus-visible { transform: rotate(180deg) translateY(14px); }
.nook { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.nook li { display: flex; gap: 10px; align-items: baseline; }
.nook .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; transform: translateY(1px); }
.nook em { color: var(--muted); font-style: normal; font-size: .92rem; }
.nook .kind { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rhymes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.rhymes span { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .92rem; }
.chant { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: var(--chip); border-radius: 14px; padding: 10px 14px; }
.chant svg { width: 64px; height: 64px; }
.chant p { margin: 0; font-family: var(--font-hand); font-size: 1.3rem; line-height: 1.25; }
.nook li.note { display: block; background: var(--sky); border-radius: 14px; padding: 10px 14px; }

.tidbit { margin-block: 8px 36px; background: var(--tid-bg); color: var(--tid-fg); border-radius: 26px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 28px; }
.tidbit > div:first-child { min-width: 0; }
.tidbit .eyebrow { color: var(--sun); }
.tidbit h2 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 800; margin-top: 6px; }
.tidbit p { margin: 10px 0 0; max-width: 62ch; opacity: .92; }
.tidbit blockquote { margin: 14px 0 0; font-family: var(--font-hand); font-size: 1.45rem; line-height: 1.3; max-width: 40ch; }
.tidbit cite { display: block; margin-top: 6px; font-style: normal; font-size: .9rem; opacity: .8; font-family: var(--font-body); }
.tips { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; max-width: 70ch; }
.tips li { background: rgba(255, 255, 255, .1); border-radius: 14px; padding: 10px 14px; display: grid; gap: 2px; }
.tips b { color: var(--sun); font-size: .9rem; }
.tips .hand { font-size: 1.25rem; line-height: 1.25; }
.episodes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.episodes span { background: rgba(255, 255, 255, .14); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: .92rem; }
.watch { display: inline-flex; align-items: center; gap: 10px; background: var(--cta); color: #fff; font-weight: 700; text-decoration: none; padding: 14px 20px; border-radius: 999px; white-space: nowrap; }
.watch:hover { background: var(--cta-hover); }
.heart { width: 64px; height: 64px; animation: beat 1.4s ease-in-out infinite; }
@keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }

/* ---------- Class info ---------- */
.hello { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--chip); border-radius: 16px; padding: 12px 16px; }
.hello .addr { font-weight: 700; user-select: all; word-break: break-all; }
.btn { font: inherit; font-weight: 700; font-size: .9rem; cursor: pointer; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 6px 14px; }
.team { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.person { background: var(--card); border-radius: 22px; padding: 22px; display: grid; grid-template-columns: 72px 1fr; gap: 16px; align-items: start; }
.person > div:last-child { min-width: 0; }
.avatar { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; color: #fff; }
.person h3 { font-size: 1.5rem; font-weight: 800; }
.person .role { color: var(--pumpkin-deep); }
.person p { margin: 8px 0 0; }
.person blockquote { margin: 10px 0 0; font-family: var(--font-hand); font-size: 1.3rem; line-height: 1.3; background: var(--chip); border-radius: 14px; padding: 10px 14px; }
.sched-wrap { overflow-x: auto; }
.sched { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 10px; min-width: 620px; }
.day { background: var(--card); border-radius: 18px; overflow: hidden; text-align: center; border: 2px solid transparent; }
.day.is-today { border-color: var(--pumpkin); }
.day .dn { background: var(--ink); color: var(--bg); font-family: var(--font-display); font-weight: 800; padding: 6px 0; letter-spacing: .05em; }
.day .what { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; padding: 12px 8px 0; }
.day .when { color: var(--pumpkin-deep); font-weight: 700; font-variant-numeric: tabular-nums; }
.day .note2 { color: var(--muted); font-size: .85rem; padding: 4px 10px 14px; }
.supplies { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.supplies label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 4px 0; }
.supplies input { width: 20px; height: 20px; accent-color: var(--leaf); flex: none; margin-top: 3px; }
.supplies input:checked + span { text-decoration: line-through; color: var(--muted); }

footer { padding-block: 0 40px; color: var(--muted); font-size: .9rem; text-align: center; position: relative; z-index: 1; }

@media (max-width: 860px) { .learn, .duo, .team { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-art { max-width: 300px; order: -1; aspect-ratio: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .hero-art svg { width: 240px; height: 240px; max-width: 100%; }
  .speech { position: static; transform: rotate(-2deg); max-width: 100%; font-size: 1.15rem; text-align: center; }
  .shelf { gap: 4px; padding-inline: 4px; }
  .book { min-width: 0; padding: 10px 2px; font-size: .78rem; }
  .ev { grid-template-columns: 64px 1fr; }
  .date-tile { width: 64px; }
  .date-tile .d { font-size: 1.35rem; }
  .date-tile .d.range { font-size: .9rem; }
  .ev .status { grid-column: 2; justify-self: start; }
  .subject { grid-template-columns: 1fr; }
  .subject .art { width: 100%; height: 150px; }
  .tidbit { grid-template-columns: 1fr; }
  .person { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .trace { stroke-dashoffset: 0; }
  .trace-fill { opacity: 1; }
}
</style>

// ===== Rendering =====
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = new Date(); today.setHours(0, 0, 0, 0);
const DAY = 86400000;
const LATEST = WEEKS[WEEKS.length - 1];
const SPINES = ["#C2457A", "#2E6F8E", "#D9701C", "#3B8F6A", "#5A4A8C", "#B5542F", "#D9579B", "#46708A"];

function statusFor(ev) {
  const s = parse(ev.d), e = parse(ev.end || ev.d);
  if (today > e) return { cls: "past", label: "Done" };
  if (today >= s) return { cls: "today", label: "Today" };
  const n = Math.round((s - today) / DAY);
  return { cls: "soon", label: n === 1 ? "Tomorrow" : `In ${n} days` };
}
function nextEvent() {
  for (const ev of LATEST.events) { const st = statusFor(ev); if (st.cls !== "past") return { ev, st }; }
  return null;
}

function heroBlock({ title, sub, pills, next, artSvg, bubble, extra = "" }) {

function renderWeek(w) {
  const isLatest = w === LATEST;
  const pills = `<span class="pill week">Week ${w.n}</span><span class="pill">${esc(w.dates)}</span><span class="pill">${esc(w.theme)}</span>` +
    (isLatest ? "" : `<span class="pill old">Past week</span>`);
  const hero = heroBlock({ title: `Ms. Hagan's <span class="tk">TK</span> News`, pills, next: nextEvent(),
    artSvg: HEROES[w.art] || HERO_APPLE, bubble: w.bubble });

  let nextMarked = false;
  const events = w.events.map(ev => {
    const s = parse(ev.d), st = statusFor(ev);
    let cls = "ev" + (st.cls === "past" ? " past" : "");
    if (st.cls !== "past" && !nextMarked) { cls += " next"; nextMarked = true; }
    const dayText = ev.end ? `${s.getDate()}${ev.and ? " & " : "–"}${parse(ev.end).getDate()}` : s.getDate();
    return `<li class="${cls}">
      <div class="date-tile"><div class="mo">${MONTHS[s.getMonth()]}</div><div class="d${ev.end ? " range" : ""}">${dayText}</div></div>
      <div class="ev-body"><h3>${esc(ev.title)}</h3>${ev.detail ? `<p>${esc(ev.detail)}</p>` : ""}${ev.todo ? `<span class="todo">${ev.icon || "📚"} ${esc(ev.todo)}</span>` : ""}</div>
      <span class="status ${st.cls === "past" ? "" : st.cls}">${st.label}</span></li>`;
  }).join("");

  const learning = w.learning.map(s => `<article class="subject${s.wide ? " wide" : ""}">
      <div class="art" aria-hidden="true">${art(s.art)}</div>
      <div><div class="eyebrow tag">${esc(s.name)}</div><h3>${esc(s.title)}</h3>
        ${s.items ? `<ul>${s.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
        ${s.text ? `<p>${esc(s.text)}</p>` : ""}
        ${s.choices ? `<div class="choice-key"><span><i style="background:var(--leaf)"></i>Green choice</span><span><i style="background:var(--berry)"></i>Red choice</span></div>` : ""}
      </div></article>`).join("");

  const r = w.reminders;
  const reminders = `<div class="panel"><div class="eyebrow">${esc(r.eyebrow || "Reminders")}</div><h2>${esc(r.title || "Don't forget")}</h2>
    ${r.clock ? `<div class="clock-row"><svg class="clock" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="var(--sky)" stroke="var(--ink)" stroke-width="5"/><line x1="50" y1="50" x2="50" y2="78" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><line class="hand-m" x1="50" y1="50" x2="50" y2="18" stroke="var(--pumpkin)" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="50" r="5" fill="var(--ink)"/></svg><div><div class="big-time">${esc(r.clock)}</div><div>${esc(r.clockNote)}</div></div></div>` : ""}
    <ul class="plain">${r.items.map(i => `<li>${i}</li>`).join("")}</ul>
    ${r.note ? `<div class="thanks">${esc(r.note)}</div>` : ""}</div>`;

  let bi = 0;
  const books = w.nook.filter(x => x.type === "book").map(b => ({ ...b, color: SPINES[bi++ % SPINES.length] }));
  const heights = [150, 176, 140, 164, 128, 184];
  const shelf = books.length ? `<div class="shelf">${books.map((b, i) => `<button type="button" class="book" style="background:${b.color};height:${heights[i % 6]}px" aria-label="${esc(b.title)}">${esc(b.title)}</button>`).join("")}</div>` : "";
  let bj = 0;
  const nookList = w.nook.map(x => {
    if (x.type === "book") { const b = books[bj++]; return `<li><span class="sw" style="background:${b.color}"></span><span><strong>${esc(b.title)}</strong>${b.author ? ` <em>by ${esc(b.author)}</em>` : ""}</span></li>`; }
    if (x.type === "song") return `<li><span class="sw" style="background:var(--sun);border-radius:50%"></span><span><span class="kind">Song</span><br>${esc(x.title)}</span></li>`;
    if (x.type === "rhymes") return `<li style="display:block"><span class="kind">${esc(x.title)}</span><div class="rhymes">${x.list.map(t => `<span>${esc(t)}</span>`).join("")}</div></li>`;
    if (x.type === "chant") return `<li class="chant">${chantSvg(x.num)}<div><span class="kind">Memorize #${esc(x.num)} chant</span><p>“${esc(x.text)}”</p></div></li>`;
    if (x.type === "note") return `<li class="note"><span class="kind">${esc(x.title)}</span><br>${esc(x.text)}</li>`;
    return "";
  }).join("");
  const nook = `<div class="panel"><div class="eyebrow">Book Nook</div><h2>On our shelf</h2>${shelf}<ul class="nook">${nookList}</ul></div>`;

  const t = w.tidbit;
  const tidbit = `<aside class="tidbit"><div>
      <div class="eyebrow">${esc(t.eyebrow)}</div><h2>${esc(t.title)}</h2>
      ${t.body ? `<p>${esc(t.body)}</p>` : ""}
      ${t.tips ? `<ul class="tips">${t.tips.map(([h, q]) => `<li><b>${esc(h)}</b><span class="hand">${esc(q)}</span></li>`).join("")}</ul>` : ""}
      ${t.chips ? `<div class="episodes">${t.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>` : ""}
      ${t.quote ? `<blockquote>“${esc(t.quote)}”${t.cite ? `<cite>— ${esc(t.cite)}</cite>` : ""}</blockquote>` : (t.cite ? `<p><cite>— ${esc(t.cite)}</cite></p>` : "")}
    </div>
    <div style="display:grid;justify-items:center;gap:14px">
      <svg class="heart" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 56 C 6 38, 2 24, 10 14 C 18 4, 30 8, 32 18 C 34 8, 46 4, 54 14 C 62 24, 58 38, 32 56 Z" fill="var(--berry)"/></svg>
      ${t.link ? `<a class="watch" href="${esc(t.link.href)}" target="_blank" rel="noopener">${esc(t.link.label)}</a>` : ""}
    </div></aside>`;

  return `${hero}
    <section><div class="wrap"><div class="sec-head"><h2>Upcoming events</h2><span class="eyebrow">As listed in Week ${w.n}</span></div><ol class="timeline">${events}</ol></div></section>
    <section><div class="wrap"><div class="sec-head"><h2>Our learning</h2><span class="eyebrow">This week in class</span></div><div class="learn">${learning}</div></div></section>
    <section><div class="wrap duo">${reminders}${nook}</div></section>
    <div class="wrap">${tidbit}</div>`;
}

  const hero = heroBlock({ title: `TK Info <span class="tk">Snapshot</span>`, sub: "Ms. Hagan ~ Room 2",
    pills: `<span class="pill week">Class info</span><span class="pill">2026–27 school year</span>`,
    artSvg: HEROES.book, bubble: "Welcome to Room 2!",
    extra: `<div class="hello"><span>Send me a quick hello:</span><span class="addr" id="addr">${esc(INFO.email)}</span><button type="button" class="btn" id="copyAddr">Copy</button></div>` });
  const wd = today.getDay();
  const team = INFO.team.map(p => `<article class="person"><div class="avatar" style="background:${p.color}" aria-hidden="true">${p.initials}</div>
      <div><div class="eyebrow role">${esc(p.role)}</div><h3>Meet ${esc(p.name)}</h3>${p.bio.map(b => `<p>${esc(b)}</p>`).join("")}
      ${p.quote ? `<blockquote>“${esc(p.quote)}”</blockquote>` : ""}</div></article>`).join("");
  const sched = INFO.schedule.map((s, i) => `<div class="day${wd === i + 1 ? " is-today" : ""}"><div class="dn">${s.day}</div>
      <div class="what">${esc(s.what)}</div>${s.when ? `<div class="when">${esc(s.when)}</div>` : ""}<div class="note2">${s.note ? esc(s.note) : "&nbsp;"}</div></div>`).join("");
  const supplies = INFO.supplies.map((s, i) => `<li><label><input type="checkbox" id="sup-${i}" data-i="${i}"><span>${esc(s)}</span></label></li>`).join("");
  return `${hero}
    <section><div class="wrap"><div class="sec-head"><h2>Meet the team</h2><span class="eyebrow">Room 2</span></div><div class="team">${team}</div></div></section>
    <section><div class="wrap"><div class="sec-head"><h2>Specialist schedule</h2><span class="eyebrow">Dress for P.E. on Mon, Tue &amp; Fri</span></div><div class="sched-wrap"><div class="sched">${sched}</div></div></div></section>
    <section><div class="wrap duo">
      <div class="panel"><div class="eyebrow">Suggested school supplies</div><h2>Supply checklist</h2><ul class="supplies">${supplies}</ul></div>
      <div class="panel"><div class="eyebrow">Ordering lunch</div><h2>Lunch &amp; snack</h2><ul class="plain">${INFO.lunch.map(l => `<li>${esc(l)}</li>`).join("")}</ul></div>
    </div></section>`;
}

// ===== Navigation =====
let sky = "leaves";
const nav = document.getElementById("weeknav"), view = document.getElementById("view"), foot = document.getElementById("foot");
const keys = [...WEEKS.map(w => "week-" + w.n), "info"];
nav.innerHTML = [...WEEKS].reverse().map(w => `<button type="button" class="wk" data-k="week-${w.n}"><b>Week ${w.n}${w === LATEST ? ' <span class="new">· New</span>' : ""}</b><small>${esc(w.dates.replace(", 2026", ""))}</small></button>`).join("") +
  `<button type="button" class="wk info" data-k="info"><b>Class info</b><small>Team, schedule, supplies</small></button>`;

function show(k, scroll) {
  if (!keys.includes(k)) k = "week-" + LATEST.n;
  nav.querySelectorAll(".wk").forEach(b => b.toggleAttribute("aria-current", false));
  const btn = nav.querySelector(`[data-k="${k}"]`); btn.setAttribute("aria-current", "page");
  btn.scrollIntoView({ block: "nearest", inline: "nearest" });
  if (k === "info") {
    sky = "leaves";
    view.innerHTML = renderInfo();
    foot.textContent = "From the TK Info Snapshot · Ms. Hagan ~ Room 2";
    wireInfo();
  } else {
    const w = WEEKS.find(x => "week-" + x.n === k);
    sky = w.sky || "leaves";
    view.innerHTML = renderWeek(w);
    foot.textContent = `Shared from Ms. Hagan's weekly TK newsletter · Week ${w.n}, ${w.dates}`;
  }
  if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
}
nav.addEventListener("click", e => { const b = e.target.closest(".wk"); if (!b) return; history.replaceState(null, "", "#" + b.dataset.k); show(b.dataset.k, true); });
window.addEventListener("hashchange", () => show(location.hash.slice(1), true));

function wireInfo() {
  const copy = document.getElementById("copyAddr");
  copy.addEventListener("click", () => {
    const done = () => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("addr")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = "Selected"; };
    try { navigator.clipboard.writeText(INFO.email).then(done, fallback); } catch (e) { fallback(); }
  });
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem("tk-supplies") || "[]"); } catch (e) {}
  document.querySelectorAll(".supplies input").forEach(cb => {
    cb.checked = saved.includes(+cb.dataset.i);
    cb.addEventListener("change", () => {
      const on = [...document.querySelectorAll(".supplies input")].filter(x => x.checked).map(x => +x.dataset.i);
      try { localStorage.setItem("tk-supplies", JSON.stringify(on)); } catch (e) {}
    });
  });
}

show(location.hash.slice(1), false);

// ===== Falling leaves =====
(function () {
  const c = document.getElementById("leaves"), ctx = c.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { c.remove(); return; }
  const colors = ["#EE7417", "#F4B227", "#CC3B33", "#8A5A2B"];
  let W, H, leaves = [];
  const resize = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; };
  resize(); addEventListener("resize", resize);
  const make = init => ({ x: Math.random() * W, y: init ? Math.random() * H : -30, r: (6 + Math.random() * 7) * devicePixelRatio,
    vy: (0.3 + Math.random() * 0.6) * devicePixelRatio, sway: Math.random() * 6.28, rot: Math.random() * 6.28, color: colors[Math.floor(Math.random() * colors.length)] });
  for (let i = 0; i < (innerWidth < 640 ? 9 : 16); i++) leaves.push(make(true));
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    leaves.forEach((l, i) => {
      l.sway += 0.015; l.y += l.vy; l.x += Math.sin(l.sway) * 0.6 * devicePixelRatio; l.rot += 0.01;
      if (l.y > H + 30) leaves[i] = make(false);
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot);
      if (sky === "rain") {
        ctx.globalAlpha = 0.35; ctx.fillStyle = "#3A7BC8"; ctx.rotate(-l.rot); const r = l.r * 0.6;
        ctx.beginPath(); ctx.moveTo(0, -r * 1.6); ctx.quadraticCurveTo(r, 0, 0, r); ctx.quadraticCurveTo(-r, 0, 0, -r * 1.6); ctx.fill();
      } else if (sky === "stars") {
        ctx.globalAlpha = 0.35 + 0.35 * Math.sin(l.sway * 3); ctx.fillStyle = "#F4B227"; const r = l.r * 0.8;
        ctx.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? r * 0.35 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill();
      } else {
        ctx.globalAlpha = 0.5; ctx.fillStyle = l.color;
        ctx.beginPath(); ctx.moveTo(0, -l.r); ctx.quadraticCurveTo(l.r, 0, 0, l.r); ctx.quadraticCurveTo(-l.r, 0, 0, -l.r); ctx.fill();
      }
      ctx.restore();
    });
    requestAnimationFrame(tick);
  })();
})();
</script>
